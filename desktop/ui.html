<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Konectx</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap');
        :root {
            --bg:#06060a;--surface:#0d0d14;--border:rgba(255,255,255,0.06);--border-h:rgba(255,255,255,0.12);
            --text:#e8e8ed;--text-mid:#8888a0;--text-dim:#4a4a5e;
            --accent:#00e87b;--accent-dim:rgba(0,232,123,0.08);
            --rosa:#e040fb;--azul:#00b4d8;
        }
        *{box-sizing:border-box;margin:0;padding:0}
        body{
            background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;
            height:100vh;display:flex;flex-direction:column;align-items:center;
            justify-content:center;padding:24px;-webkit-font-smoothing:antialiased;
            overflow:hidden;
        }

        .logo{font-size:1.3rem;font-weight:700;letter-spacing:-0.5px;margin-bottom:4px}
        .logo span{color:var(--accent)}
        .sub{font-size:0.65rem;color:var(--text-dim);letter-spacing:1px;text-transform:uppercase;margin-bottom:24px}

        .status{
            width:100%;max-width:340px;padding:10px 16px;border-radius:12px;
            background:var(--surface);border:1px solid var(--border);
            text-align:center;font-weight:500;font-size:0.82rem;
            margin-bottom:20px;transition:all 0.3s;
        }
        .status.aguardando{color:var(--text-dim)}
        .status.conectado{color:var(--accent);border-color:rgba(0,232,123,0.15)}
        .status.gesto-dir{color:var(--rosa);border-color:rgba(224,64,251,0.2)}
        .status.gesto-esq{color:var(--azul);border-color:rgba(0,180,216,0.2)}
        .status.erro{color:#ff4466;border-color:rgba(255,68,102,0.15)}

        .code-section{
            background:var(--surface);border:1px solid var(--border);
            border-radius:20px;padding:28px;width:100%;max-width:340px;
            text-align:center;margin-bottom:20px;
        }
        .code-label{
            font-family:'JetBrains Mono',monospace;font-size:0.6rem;color:var(--text-dim);
            letter-spacing:2px;text-transform:uppercase;margin-bottom:14px;
        }
        .code-display{
            font-family:'JetBrains Mono',monospace;font-size:2.8rem;font-weight:700;
            letter-spacing:10px;color:var(--accent);margin-bottom:8px;
            text-shadow:0 0 30px rgba(0,232,123,0.2);
        }
        .code-hint{font-size:0.7rem;color:var(--text-dim);line-height:1.6}
        .code-url{
            font-family:'JetBrains Mono',monospace;font-size:0.65rem;
            color:var(--text-mid);margin-top:10px;padding:6px 12px;
            background:var(--bg);border-radius:6px;display:inline-block;
            border:1px solid var(--border);
        }

        .instrucoes{font-size:0.7rem;color:var(--text-dim);text-align:center;line-height:1.8;max-width:300px}
        .instrucoes strong{color:var(--text-mid)}
    </style>
</head>
<body>
    <div class="logo">konect<span>x</span></div>
    <div class="sub">Controle por gestos</div>

    <div class="status aguardando" id="status">Conectando ao servidor...</div>

    <div class="code-section">
        <div class="code-label">Codigo da sala</div>
        <div class="code-display" id="code-display">------</div>
        <div class="code-hint">
            No relogio ou celular, acesse:
        </div>
        <div class="code-url">konectx.tkfouri.is-a.dev</div>
        <div class="code-hint" style="margin-top:6px">
            e digite o codigo acima
        </div>
    </div>

    <div class="instrucoes">
        <strong>1.</strong> Acesse o site no relogio<br>
        <strong>2.</strong> Digite o codigo e conecte<br>
        <strong>3.</strong> Abra o PowerPoint e apresente
    </div>

    <script>
        const { exec } = require('child_process');

        const RELAY = 'https://konectx.tkfouri.is-a.dev';
        const status = document.getElementById('status');
        const codeDisplay = document.getElementById('code-display');

        function setStatus(texto, classe) {
            status.textContent = texto;
            status.className = 'status ' + classe;
        }

        function enviarTecla(direcao) {
            const tecla = direcao === 'direita' ? '{RIGHT}' : '{LEFT}';
            exec('powershell.exe -c "$wshell = New-Object -ComObject wscript.shell; $wshell.SendKeys(\'' + tecla + '\')"');
        }

        async function iniciar() {
            try {
                const resp = await fetch(RELAY + '/api/sala', { method: 'POST' });
                const { codigo } = await resp.json();
                codeDisplay.textContent = codigo;
                setStatus('Aguardando dispositivo...', 'aguardando');

                const io = require('socket.io-client');
                const socket = io(RELAY);

                socket.on('connect', () => {
                    socket.emit('entrar-sala', { codigo, tipo: 'pc' });
                });

                socket.on('parceiro-conectou', () => {
                    setStatus('Dispositivo conectado', 'conectado');
                });

                socket.on('parceiro-desconectou', () => {
                    setStatus('Dispositivo desconectou', 'aguardando');
                });

                socket.on('gesto', (classe) => {
                    enviarTecla(classe);
                    if (classe === 'direita') {
                        setStatus('Avancar  >>', 'gesto-dir');
                    } else {
                        setStatus('<<  Voltar', 'gesto-esq');
                    }
                    setTimeout(() => setStatus('Dispositivo conectado', 'conectado'), 1000);
                });

                socket.on('disconnect', () => {
                    setStatus('Desconectado do servidor', 'erro');
                });

            } catch (e) {
                setStatus('Erro: ' + e.message.substring(0, 35), 'erro');
                setTimeout(iniciar, 5000);
            }
        }

        iniciar();
    </script>
</body>
</html>
